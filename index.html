
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <div class="main-container">
        <input type="text" id="screen" placeholder="0" readonly>

        <div class="keypad">
            <button class="action-btn" onclick="resetAll()">CLR</button>
            <button class="action-btn" onclick="removeLast()">DEL</button>
            <button class="math-op" onclick="press('/')">÷</button>
            <button class="math-op" onclick="press('*')">×</button>

            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="math-op" onclick="press('-')">−</button>

            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="math-op" onclick="press('+')">+</button>

            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button class="solve-btn" onclick="finalResult()">=</button>

            <button class="big-btn" onclick="press('0')">0</button>
            <button onclick="press('.')">.</button>
        </div>
    </div>

    <script src="Script.js"></script>

</body>
</html>
